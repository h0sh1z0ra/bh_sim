<!DOCTYPE html>
<html>
<head>
    <meta charset="utf8">
    <title>Black Hole</title>
    <style>
        body { background:#111; color:#eee; font-family: sans-serif; text-align: center; }
        canvas { border:1px solid #333; image-rendering: pixelated; }
        #controls { margin:12px; }
    </style>
</head>


<body>
    <h2>Kerr Black Hole</h2>
    <canvas id="canvas" width="400" height="225"></canvas>
    <div id="controls">
        <label>spin: <input autocomplete = "off" id="spin" type = "range" min = "0" max = "0.99" step = "0.01" value = "0"></label>
        <span id="spinval">0</span>
        <button id="go">Render</button>
    </div>
    <div id="status">loading...</div>

    <script src="bh.js"></script>
    <script>
        const W = 250, H = 140;

        Module.onRuntimeInitialized = () => {
            Module._init(W, H);
            const w = Module._get_width();
            const h = Module._get_height();
            console.log("Actual size: ", w, h);
            
            document.getElementById('status').textContent = 'ready';

            const cv = document.getElementById('canvas');
            cv.width = w; cv.height = h;
            const ctx = cv.getContext('2d');
            
            // Read pixel buffer straight out of WASM memory
            function blit() {
                const ptr  = Module._get_pixels();
                const data = new Uint8ClampedArray(Module.HEAPU8.buffer, ptr, w * h * 4);
                ctx.putImageData(new ImageData(data, w, h), 0, 0);
            }

            function render() {
                document.getElementById('status').textContent = 'rendering...';
                setTimeout(() => {
                    const t0 = performance.now();
                    Module._render_frame();
                    blit();
                    const ms = (performance.now() - t0).toFixed(0);  // roind to 0
                    document.getElementById('status').textContent = `rendered in ${ms} ms`;
                }, 0);
            }

            document.getElementById('go').onclick = render;
            document.getElementById('spin').oninput = e => {
                const v = parseFloat(e.target.value);
                document.getElementById('spinval').textContent = v.toFixed(2);
                Module._set_spin(v);
            }

            render();
        };
    </script>
</body>
</html>
